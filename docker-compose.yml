version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: sokoyetu
      POSTGRES_USER: sokoyetu
      POSTGRES_PASSWORD: sokoyetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgres://sokoyetu:sokoyetu@postgres:5432/sokoyetu
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      UPLOAD_DIR: /app/uploads
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build: ./backend
    command: python -u workers/process_image.py
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      - backend

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/usr/src/app
    command: sh -c "npm install && npm run build && npm run preview -- --port 3000"
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  minio_data:
